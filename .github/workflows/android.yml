---
name: 📱 Android
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  release:
    types: ['published']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # attach APKs to releases built from tags
  packages: read # read the public QField vcpkg binary cache

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      TRIPLET: arm64-android
      ALL_FILES_ACCESS: 'OFF'
      ARTIFACT_NAME: android-arm64
      # Local vcpkg binary cache, kept between runs with actions/cache.
      # The upstream QField nuget feed is appended to this by cmake/VcpkgToolchain.cmake.
      VCPKG_DEFAULT_BINARY_CACHE: /home/runner/vcpkg-archives
      VCPKG_BINARY_SOURCES: 'default,readwrite'

    steps:
      - name: 🐣 Checkout
        uses: actions/checkout@v7.0.1

      - name: 🧹 Reclaim disk space
        run: |
          df . -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df . -h

      - name: 🌾 Prepare variables
        shell: bash
        run: |
          NDK_VERSION=29.0.14206865
          BUILD_TOOLS_VERSION=35.0.1
          if [ ! -d "${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" ] || [ ! -d "${ANDROID_SDK_ROOT}/build-tools/${BUILD_TOOLS_VERSION}" ]; then
            yes | "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" "ndk;${NDK_VERSION}" "build-tools;${BUILD_TOOLS_VERSION}" > /dev/null
          fi
          echo "JAVA_HOME=${JAVA_HOME_17_X64}" >> $GITHUB_ENV
          echo "ANDROID_BUILD_TOOLS_VERSION=${BUILD_TOOLS_VERSION}" >> $GITHUB_ENV
          echo "ANDROID_NDK_VERSION=${NDK_VERSION}" >> $GITHUB_ENV
          echo "ANDROID_NDK=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> $GITHUB_ENV
          echo "ndk.dir=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> local.properties
          ./scripts/ci/env_gh.sh

          echo "BUILD_TYPE=Release" >> $GITHUB_ENV
          echo "CMAKE_BUILD_DIR=/home/runner/builddir" >> $GITHUB_ENV
          mkdir -p "${VCPKG_DEFAULT_BINARY_CACHE}"

      # nuget (through mono) is how vcpkg reads the upstream binary cache
      - name: 🪟 Setup .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 8.0.x

      - name: 🐵 Install Mono
        run: |
          sudo apt install ca-certificates gnupg
          sudo gpg --homedir /tmp --no-default-keyring --keyring gnupg-ring:/usr/share/keyrings/mono-official-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys 3FA7E0328081BFF6A14DA29AA6A19B38D3D831EF
          sudo chmod +r /usr/share/keyrings/mono-official-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/mono-official-archive-keyring.gpg] https://download.mono-project.com/repo/ubuntu stable-focal main" | sudo tee /etc/apt/sources.list.d/mono-official-stable.list
          sudo apt update
          sudo apt install mono-devel

      - name: 🐩 Install CMake and Ninja
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: 3.29.0

      - name: 🔨 Prepare build env
        run: |
          sudo apt-get update
          sudo apt-get install -y gperf autopoint '^libxcb.*-dev' libxrandr-dev libx11-xcb-dev libsm-dev libegl1-mesa-dev libglu1-mesa-dev libxrender-dev libxi-dev libxkbcommon-dev libxkbcommon-x11-dev autoconf-archive libgstreamer-gl1.0-0 libgstreamer-plugins-base1.0-0 libfuse2 libcups2-dev nasm libltdl-dev
          wget https://github.com/Kitware/CMake/releases/download/v3.31.6/cmake-3.31.6-linux-x86_64.sh -O /tmp/cmakeinstall.sh
          chmod +x /tmp/cmakeinstall.sh
          sudo /tmp/cmakeinstall.sh --prefix=/usr/local --exclude-subdir
          rm /tmp/cmakeinstall.sh

      - name: ♻️ Restore vcpkg cache
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ env.TRIPLET }}-${{ hashFiles('vcpkg.json', 'vcpkg/**', 'cmake/VcpkgToolchain.cmake') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            vcpkg-${{ env.TRIPLET }}-${{ hashFiles('vcpkg.json', 'vcpkg/**', 'cmake/VcpkgToolchain.cmake') }}-
            vcpkg-${{ env.TRIPLET }}-

      - name: 🌱 Install dependencies and generate project files
        id: configure
        env:
          WORKSPACE: ${{ github.workspace }}
        run: |
          echo "VCPKG_ARCHIVES_BEFORE=$(find "${VCPKG_DEFAULT_BINARY_CACHE}" -type f | wc -l)" >> $GITHUB_ENV
          source ./scripts/version_number.sh
          source ./scripts/ci/generate-version-details.sh

          # Leave time to save the vcpkg cache if building the dependencies from
          # source takes too long; the next run then continues from the cache.
          timeout 320m cmake -S "${{ github.workspace }}" \
                -B "${CMAKE_BUILD_DIR}" \
                -G Ninja \
                -D CMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
                -D ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT} \
                -D ANDROID_NDK_VERSION="${ANDROID_NDK_VERSION}" \
                -D ANDROID_BUILD_TOOLS_VERSION="${ANDROID_BUILD_TOOLS_VERSION}" \
                -D VCPKG_TARGET_TRIPLET="${TRIPLET}" \
                -D VCPKG_INSTALL_OPTIONS="--x-abi-tools-use-exact-versions" \
                -D WITH_ALL_FILES_ACCESS="${ALL_FILES_ACCESS}" \
                -D WITH_SPIX=OFF \
                -D APP_VERSION="${APP_VERSION}" \
                -D APK_VERSION_CODE="${APK_VERSION_CODE}" \
                -D APP_VERSION_STR="${APP_VERSION_STR}" \
                -D APP_PACKAGE_NAME="${APP_PACKAGE_NAME}" \
                -D APP_ICON="${APP_ICON}" \
                -D APP_NAME="${APP_NAME}" \
                -D NUGET_USERNAME="${{ github.actor }}" \
                -D NUGET_TOKEN="${{ secrets.GITHUB_TOKEN }}" \
                -D NUGET_CACHE_MODE=read

      - name: 🔎 Check vcpkg cache changes
        id: vcpkg-changes
        if: always()
        run: |
          AFTER=$(find "${VCPKG_DEFAULT_BINARY_CACHE}" -type f | wc -l)
          echo "vcpkg archives: before=${VCPKG_ARCHIVES_BEFORE:-0} after=${AFTER}"
          du -sh "${VCPKG_DEFAULT_BINARY_CACHE}" || true
          if [ "${AFTER}" != "${VCPKG_ARCHIVES_BEFORE:-0}" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: 💾 Save vcpkg cache
        if: always() && steps.vcpkg-changes.outputs.changed == 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ env.TRIPLET }}-${{ hashFiles('vcpkg.json', 'vcpkg/**', 'cmake/VcpkgToolchain.cmake') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: ⏱️ Explain a dependency timeout
        if: failure() && steps.configure.outcome == 'failure'
        run: |
          echo "::warning::Dependencies did not finish building in this run. The ones that did were saved to the cache: re-run this workflow to continue from there."

      - name: 📑 Upload dependency build logs
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: build-logs-${{ env.TRIPLET }}
          path: |
            ${{ env.CMAKE_BUILD_DIR }}/**/*.log

      - name: 🌋 Build
        run: |
          cmake --build "${{ env.CMAKE_BUILD_DIR }}" --config ${{ env.BUILD_TYPE }}

      # Optional release signing. Without these secrets the APK is signed with
      # a debug key, which installs fine but cannot be published on the Play Store.
      - name: 🔑 Setup signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "${ANDROID_KEYSTORE_BASE64}" ]; then
            echo "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > ./keystore.p12
          fi

      - name: 📦 Package
        env:
          KEYNAME: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEYPASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STOREPASS: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          cmake --build "${{ env.CMAKE_BUILD_DIR }}" --target bundle --config Release
          mkdir -p /tmp/apk
          OUT="${{ env.CMAKE_BUILD_DIR }}/src/app/android-build/build/outputs/apk"
          if [ -f "${OUT}/release/android-build-release-signed.apk" ]; then
            cp "${OUT}/release/android-build-release-signed.apk" "/tmp/apk/${CI_PACKAGE_NAME}-${CI_PACKAGE_FILE_SUFFIX}-${ARTIFACT_NAME}.apk"
          fi
          if [ -f "${OUT}/debug/android-build-debug.apk" ]; then
            cp "${OUT}/debug/android-build-debug.apk" "/tmp/apk/${CI_PACKAGE_NAME}-${CI_PACKAGE_FILE_SUFFIX}-${ARTIFACT_NAME}-debug.apk"
          fi
          ls -lh /tmp/apk
          test -n "$(ls /tmp/apk)"

      - name: 📤 Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.CI_PACKAGE_NAME }}-${{ env.CI_PACKAGE_FILE_SUFFIX }}-${{ env.ARTIFACT_NAME }}
          path: /tmp/apk/*.apk

      - name: 🚀 Attach APK to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" > /dev/null 2>&1 || gh release create "${GITHUB_REF_NAME}" --title "GeoCampo ${GITHUB_REF_NAME}" --generate-notes
          gh release upload "${GITHUB_REF_NAME}" /tmp/apk/*.apk --clobber
